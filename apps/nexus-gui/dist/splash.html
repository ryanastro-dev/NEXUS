<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-base: #070d18;
        --bg-surface: #0a1324;
        --card-border: rgba(34, 211, 238, 0.2);
        --card-inner: rgba(8, 16, 32, 0.97);
        --text-primary: #f8fafc;
        --text-secondary: #93a6bd;
        --accent-cyan: #06b6d4;
        --accent-blue: #2563eb;
        --track-bg: rgba(148, 163, 184, 0.3);
        --bar-gradient: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
        --mesh-a: rgba(34, 211, 238, 0.16);
        --mesh-b: rgba(37, 99, 235, 0.14);
        --shadow-1: 0 20px 50px rgba(2, 8, 20, 0.55);
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg-base: #f2f7ff;
          --bg-surface: #f8fafc;
          --card-border: rgba(37, 99, 235, 0.22);
          --card-inner: rgba(255, 255, 255, 0.98);
          --text-primary: #0f172a;
          --text-secondary: #4b6078;
          --accent-cyan: #0891b2;
          --accent-blue: #2563eb;
          --track-bg: rgba(148, 163, 184, 0.28);
          --bar-gradient: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
          --mesh-a: rgba(8, 145, 178, 0.1);
          --mesh-b: rgba(37, 99, 235, 0.1);
          --shadow-1: 0 18px 40px rgba(30, 41, 59, 0.16);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        cursor: default;
      }

      body {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(95% 72% at 14% 18%, var(--mesh-a), transparent 58%),
          radial-gradient(82% 66% at 86% 14%, var(--mesh-b), transparent 56%),
          var(--bg-base);
        color: var(--text-primary);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans",
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        padding: 18px;
        text-align: center;
        border-radius: 0;
        background:
          radial-gradient(120% 100% at 50% -18%, rgba(34, 211, 238, 0.14), transparent 56%),
          linear-gradient(160deg, rgba(10, 19, 36, 0.98), rgba(7, 13, 24, 0.98));
        border: 0;
        box-shadow: none;
        animation: card-enter 0.5s ease-out both;
      }

      .stack {
        width: min(320px, calc(100vw - 36px));
        text-align: center;
      }

      .logo-wrap {
        width: 56px;
        height: 56px;
        margin: 0 auto 14px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.16), rgba(37, 99, 235, 0.12));
        border: 1px solid rgba(34, 211, 238, 0.18);
      }

      .logo {
        width: 32px;
        height: 32px;
        color: var(--accent-cyan);
        filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.26));
      }

      .title {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.02em;
        line-height: 1;
        margin-bottom: 6px;
        color: var(--text-primary);
      }

      .subtitle {
        font-size: 11px;
        font-weight: 600;
        color: var(--accent-cyan);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      .progress-track {
        width: min(250px, 86%);
        height: 5px;
        margin: 0 auto 10px;
        border-radius: 999px;
        background: var(--track-bg);
        overflow: hidden;
      }

      .progress-fill {
        width: 38%;
        height: 100%;
        border-radius: 999px;
        background: var(--bar-gradient);
        animation: progress-slide 1.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
      }

      .status {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
        min-height: 16px;
        animation: fade-text 2s ease-in-out infinite;
        letter-spacing: 0.02em;
      }

      @keyframes card-enter {
        from {
          opacity: 0.2;
          transform: translateY(8px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes progress-slide {
        0% {
          transform: translateX(-100%);
          width: 20%;
        }
        50% {
          transform: translateX(32%);
          width: 58%;
        }
        100% {
          transform: translateX(195%);
          width: 20%;
        }
      }

      @keyframes fade-text {
        0%,
        100% {
          opacity: 0.78;
        }
        50% {
          opacity: 1;
        }
      }

      @media (max-width: 420px) {
        .title {
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" data-tauri-drag-region>
      <div class="stack">
        <div class="logo-wrap">
          <svg class="logo" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path d="M32 8L50 17L32 26L14 17L32 8Z" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" />
            <path d="M14 28L32 37L50 28" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M14 39L32 48L50 39" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="32" cy="26" r="4.5" stroke="currentColor" stroke-width="3" />
          </svg>
        </div>

        <h1 class="title">NEXUS</h1>
        <p class="subtitle">NetMapper Pro</p>

        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>

        <p class="status" id="status-text">Loading secure modules...</p>
      </div>
    </main>
    <script src="/splash-status.js" defer></script>
  </body>
</html>
