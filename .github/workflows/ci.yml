name: CI Release Gates

on:
  push:
    branches:
      - main
      - master
      - work
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-linux:
    name: Rust quality (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpcap-dev \
            patchelf

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  frontend-gates:
    name: Frontend quality gates
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/nexus-gui

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nexus-gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  windows-link-check:
    name: Windows build/link check (Npcap SDK)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Npcap SDK (Packet.lib)
        shell: pwsh
        run: ./scripts/install-npcap-sdk.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Prepare frontend dist placeholder for Tauri context
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/nexus-gui/dist | Out-Null
          if (-not (Test-Path apps/nexus-gui/dist/index.html)) {
            Set-Content -Path apps/nexus-gui/dist/index.html -Value '<!doctype html><title>NEXUS</title>' -NoNewline
          }

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Cargo test (build only)
        run: cargo test --workspace --all-targets --no-run

  runtime-smoke-windows:
    name: Runtime smoke (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Npcap SDK (Packet.lib)
        shell: pwsh
        run: ./scripts/install-npcap-sdk.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nexus-gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm --prefix apps/nexus-gui ci

      - name: Smoke runtime bundle
        run: npm --prefix apps/nexus-gui run smoke:runtime

