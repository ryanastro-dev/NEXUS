name: Desktop Bootstrap Checks

on:
  push:
    branches:
      - main
      - master
      - work
    paths:
      - "apps/nexus-gui/**"
      - ".github/workflows/desktop-bootstrap.yml"
      - "scripts/desktop-smoke.ps1"
  pull_request:
    paths:
      - "apps/nexus-gui/**"
      - ".github/workflows/desktop-bootstrap.yml"
      - "scripts/desktop-smoke.ps1"

permissions:
  contents: read

concurrency:
  group: desktop-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend build (nexus-gui)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/nexus-gui

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nexus-gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

