name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build desktop (${{ matrix.platform_id }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform_id: linux-x64
            tauri_args: ""
            needs_npcap: false
            experimental: false
          - os: windows-latest
            platform_id: windows-x64
            tauri_args: ""
            needs_npcap: true
            experimental: false
          - os: macos-15-intel
            platform_id: macos15-intel
            tauri_args: "--target x86_64-apple-darwin"
            needs_npcap: false
            mac_target: x86_64-apple-darwin
            experimental: false
          - os: macos-15
            platform_id: macos15-arm64
            tauri_args: "--target aarch64-apple-darwin"
            needs_npcap: false
            mac_target: aarch64-apple-darwin
            experimental: false
          - os: macos-26
            platform_id: macos26-arm64-beta
            tauri_args: "--target aarch64-apple-darwin"
            needs_npcap: false
            mac_target: aarch64-apple-darwin
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nexus-gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: rustup target add ${{ matrix.mac_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./ -> target
            ./apps/nexus-gui/src-tauri -> target

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpcap-dev \
            patchelf

      - name: Install Npcap SDK (Packet.lib)
        if: matrix.needs_npcap
        shell: pwsh
        run: ./scripts/install-npcap-sdk.ps1

      - name: Install frontend dependencies
        working-directory: apps/nexus-gui
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/nexus-gui
        run: npm run tauri build -- ${{ matrix.tauri_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform_id }}
          path: |
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.app.tar.gz
            target/**/release/bundle/**/*.tar.gz
            apps/nexus-gui/src-tauri/target/**/release/bundle/**/*.deb
            apps/nexus-gui/src-tauri/target/**/release/bundle/**/*.rpm
            apps/nexus-gui/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/nexus-gui/src-tauri/target/**/release/bundle/**/*.exe
            apps/nexus-gui/src-tauri/target/**/release/bundle/**/*.msi
            apps/nexus-gui/src-tauri/target/**/release/bundle/**/*.dmg
            apps/nexus-gui/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            apps/nexus-gui/src-tauri/target/**/release/bundle/**/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Flatten artifact directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/flat
          find dist -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.tar.gz" \) -print0 \
            | while IFS= read -r -d '' f; do cp "$f" dist/flat/; done
          ls -la dist/flat

      - name: Verify release files exist
        shell: bash
        run: |
          set -euo pipefail
          count=$(find dist/flat -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No release files found after artifact download/flatten."
            exit 1
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NEXUS Desktop ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/flat/*.exe
            dist/flat/*.msi
            dist/flat/*.dmg
            dist/flat/*.deb
            dist/flat/*.rpm
            dist/flat/*.AppImage
            dist/flat/*.tar.gz
